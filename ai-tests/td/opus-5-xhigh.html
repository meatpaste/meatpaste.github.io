<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>MERGE PROTOCOL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070d;color:#dfe9ff;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.pe{pointer-events:auto}
/* ---- chips / top bar ---- */
#top{display:flex;gap:6px;padding:8px;flex-wrap:wrap;align-items:center}
.chip{background:rgba(10,16,30,.78);border:1px solid rgba(120,170,255,.22);border-radius:9px;
  padding:5px 9px;font-size:11px;letter-spacing:.06em;display:flex;gap:6px;align-items:center;
  backdrop-filter:blur(6px);white-space:nowrap}
.chip b{font-size:14px;letter-spacing:0}
.chip.hp b{color:#ff6b8b}.chip.gold b{color:#ffd267}.chip.wave b{color:#7fe9ff}.chip.doc b{color:#c99bff}
.spacer{flex:1}
.ib{background:rgba(10,16,30,.78);border:1px solid rgba(120,170,255,.22);border-radius:9px;
  color:#cfe0ff;font:inherit;font-size:13px;padding:6px 9px;cursor:pointer}
.ib:active{background:rgba(60,110,200,.4)}
.ib.on{border-color:#63f7c8;color:#63f7c8}
/* ---- bottom dock ---- */
#dock{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px}
#selbar{align-self:flex-start;background:rgba(8,13,26,.9);border:1px solid rgba(120,170,255,.3);
  border-radius:11px;padding:7px 9px;font-size:11px;display:none;gap:10px;align-items:center;max-width:96vw}
#selbar .nm{font-size:13px;letter-spacing:.05em}
#selbar .st{opacity:.75;line-height:1.35}
#shoprow{display:flex;gap:6px;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#shoprow::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:88px;background:linear-gradient(180deg,rgba(16,24,44,.94),rgba(8,12,24,.94));
  border:1px solid rgba(120,170,255,.24);border-radius:11px;padding:6px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;gap:3px;align-items:center;transition:transform .09s,border-color .12s}
.card:active{transform:scale(.95)}
.card.sel{border-color:#63f7c8;box-shadow:0 0 0 1px #63f7c8,0 0 18px rgba(99,247,200,.35)}
.card.poor{opacity:.4}
.card .ic{font-size:20px;line-height:1.1}
.card .nm{font-size:9.5px;letter-spacing:.06em;text-align:center}
.card .cost{font-size:11px;color:#ffd267}
.card .tag{position:absolute;top:3px;right:4px;font-size:8px;opacity:.6}
#ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#deploy{flex:1;min-width:150px;background:linear-gradient(180deg,#1f6bff,#0b3ea8);border:1px solid #6fa8ff;
  border-radius:12px;color:#fff;font:inherit;font-size:15px;letter-spacing:.12em;padding:12px 14px;cursor:pointer;
  box-shadow:0 0 22px rgba(40,110,255,.4)}
#deploy:active{transform:translateY(1px)}
#deploy.busy{background:linear-gradient(180deg,#2a3550,#141c30);border-color:#44557a;box-shadow:none;color:#8fa2c8}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(12,20,42,.86),rgba(3,5,10,.95));
  display:none;align-items:center;justify-content:center;padding:14px;overflow-y:auto;pointer-events:auto;z-index:5}
#modal.show{display:flex}
.sheet{width:100%;max-width:660px;background:linear-gradient(180deg,rgba(14,21,40,.98),rgba(7,11,22,.98));
  border:1px solid rgba(120,170,255,.3);border-radius:16px;padding:16px;box-shadow:0 22px 70px rgba(0,0,0,.7);
  max-height:94dvh;overflow-y:auto}
.h1{font-size:22px;letter-spacing:.2em;color:#8fe9ff;text-align:center}
.h1 .sub{display:block;font-size:10px;letter-spacing:.28em;color:#6c86b8;margin-top:4px}
.h2{font-size:12px;letter-spacing:.18em;color:#7f97c8;margin:14px 0 7px;border-bottom:1px solid rgba(120,170,255,.16);padding-bottom:4px}
.p{font-size:12px;line-height:1.6;opacity:.85}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.opt{background:rgba(20,30,55,.85);border:1px solid rgba(120,170,255,.25);border-radius:12px;padding:11px;
  cursor:pointer;transition:transform .09s,border-color .12s,background .12s}
.opt:hover{border-color:#8fe9ff}.opt:active{transform:scale(.97)}
.opt .t{font-size:13px;letter-spacing:.08em;color:#fff}
.opt .d{font-size:11px;line-height:1.5;opacity:.78;margin-top:5px}
.opt .ic{font-size:26px}
.opt.r2{border-color:#c99bff}.opt.r3{border-color:#ffd267;box-shadow:0 0 18px rgba(255,210,103,.18)}
.rowbtn{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.big{flex:1;min-width:130px;background:linear-gradient(180deg,#1f6bff,#0b3ea8);border:1px solid #6fa8ff;border-radius:12px;
  color:#fff;font:inherit;font-size:14px;letter-spacing:.12em;padding:13px;cursor:pointer}
.big.alt{background:linear-gradient(180deg,#2a3550,#141c30);border-color:#4b5d84}
.big:active{transform:translateY(1px)}
table.mx{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:6px}
table.mx th,table.mx td{border:1px solid rgba(120,170,255,.16);padding:4px 3px;text-align:center}
table.mx th{color:#7f97c8;font-weight:400;letter-spacing:.06em}
table.mx td.win{background:rgba(99,247,200,.14);color:#63f7c8}
table.mx td.lose{background:rgba(255,107,139,.1);color:#ff8fa6}
.bar{height:7px;background:rgba(255,255,255,.09);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#63f7c8,#8fe9ff)}
.kv{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;opacity:.9}
.kv b{color:#ffd267}
.mlist{display:flex;flex-direction:column;gap:7px}
.mrow{display:flex;gap:9px;align-items:center;background:rgba(20,30,55,.7);border:1px solid rgba(120,170,255,.18);
  border-radius:10px;padding:9px}
.mrow .ic{font-size:20px}
.mrow .txt{flex:1;min-width:0}
.mrow .t{font-size:12px;letter-spacing:.05em}
.mrow .d{font-size:10.5px;opacity:.7;line-height:1.4}
.mrow button{background:rgba(20,90,60,.6);border:1px solid #63f7c8;color:#9dffe0;border-radius:9px;
  font:inherit;font-size:11px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.mrow button[disabled]{background:rgba(40,48,66,.6);border-color:#465575;color:#7a89a8}
.relchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rc{font-size:9.5px;background:rgba(99,247,200,.12);border:1px solid rgba(99,247,200,.35);color:#9dffe0;
  border-radius:20px;padding:2px 7px}
/* ---- toasts ---- */
#toasts{position:fixed;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:6px;align-items:center;pointer-events:none;z-index:4;width:92vw}
.toast{background:rgba(8,14,28,.92);border:1px solid rgba(143,233,255,.4);border-radius:10px;padding:7px 13px;
  font-size:12px;letter-spacing:.06em;animation:tin .25s ease-out,tout .4s ease-in 1.7s forwards;text-align:center}
.toast.good{border-color:#63f7c8;color:#9dffe0}
.toast.bad{border-color:#ff6b8b;color:#ffa8ba}
.toast.big{font-size:16px;letter-spacing:.16em}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(-14px)}}
#hint{position:fixed;left:50%;bottom:calc(50% - 40px);transform:translateX(-50%);font-size:11px;
  letter-spacing:.14em;color:#6c86b8;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s}
@media (max-width:520px){
  .card{width:76px}.h1{font-size:18px}#deploy{font-size:14px;padding:11px}
  .chip{font-size:10px;padding:4px 7px}.chip b{font-size:12px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="top">
    <div class="chip wave"><span>WAVE</span><b id="cWave">0</b></div>
    <div class="chip hp"><span>CORE</span><b id="cHp">20</b></div>
    <div class="chip gold"><span>◈</span><b id="cGold">0</b></div>
    <div class="chip doc" id="cDoc"><span>DOCTRINE</span><b>—</b></div>
    <div class="chip" id="cTow"><span>UNITS</span><b>0/10</b></div>
    <div class="spacer"></div>
    <button class="ib pe" id="bSpeed">1×</button>
    <button class="ib pe" id="bSound">♪</button>
    <button class="ib pe" id="bInfo">?</button>
  </div>
  <div id="dock">
    <div id="selbar" class="pe"></div>
    <div id="shoprow" class="pe"></div>
    <div id="ctl">
      <button id="deploy" class="pe">DEPLOY</button>
      <button class="ib pe" id="bReroll">↻ 2◈</button>
      <button class="ib pe" id="bCam">⟲</button>
    </div>
  </div>
</div>
<div id="hint"></div>
<div id="toasts"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
'use strict';
/* ============================================================================
   MERGE PROTOCOL — a 3D tower-defense / merge / roguelike, single file, no deps.
   Renderer: hand-rolled WebGL. CPU-batched triangle soup, 4 passes.
   ========================================================================== */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=n=>Math.floor(Math.random()*n);
const pick=a=>a[rint(a.length)];
const hex=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];

/* ---------------------------- mat4 (column major) ------------------------- */
function m4mul(a,b,o){
  for(let i=0;i<4;i++){const b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
    o[i*4  ]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;
    o[i*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    o[i*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    o[i*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;}
  return o;
}
function m4persp(fov,asp,n,f,o){const t=1/Math.tan(fov/2);o.fill(0);
  o[0]=t/asp;o[5]=t;o[11]=-1;o[10]=(f+n)/(n-f);o[14]=2*f*n/(n-f);return o;}
function m4look(ex,ey,ez,cx,cy,cz,o){
  let zx=ex-cx,zy=ey-cy,zz=ez-cz;let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  // up=(0,1,0);  x = normalize(up × z) = normalize(zz,0,-zx);  y = z × x
  let xx=zz,xy=0,xz=-zx;
  l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
  o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
  o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);o[13]=-(yx*ex+yy*ey+yz*ez);o[14]=-(zx*ex+zy*ey+zz*ez);o[15]=1;
  return o;
}
function m4inv(m,o){
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7],
        a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,
        b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,
        b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if(!d)return null; d=1/d;
  o[0]=(a11*b11-a12*b10+a13*b09)*d; o[1]=(a02*b10-a01*b11-a03*b09)*d;
  o[2]=(a31*b05-a32*b04+a33*b03)*d; o[3]=(a22*b04-a21*b05-a23*b03)*d;
  o[4]=(a12*b08-a10*b11-a13*b07)*d; o[5]=(a00*b11-a02*b08+a03*b07)*d;
  o[6]=(a32*b02-a30*b05-a33*b01)*d; o[7]=(a20*b05-a22*b02+a23*b01)*d;
  o[8]=(a10*b10-a11*b08+a13*b06)*d; o[9]=(a01*b08-a00*b10-a03*b06)*d;
  o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
  o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;
  o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;
  return o;
}
function unproj(inv,nx,ny,nz,out){
  const x=inv[0]*nx+inv[4]*ny+inv[8]*nz+inv[12], y=inv[1]*nx+inv[5]*ny+inv[9]*nz+inv[13],
        z=inv[2]*nx+inv[6]*ny+inv[10]*nz+inv[14], w=inv[3]*nx+inv[7]*ny+inv[11]*nz+inv[15];
  out[0]=x/w;out[1]=y/w;out[2]=z/w;return out;
}

/* ------------------------------- meshes ---------------------------------- */
function mb(){return{p:[],n:[]};}
function tri(o,ax,ay,az,bx,by,bz,cx,cy,cz){
  const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
  let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
  const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
  o.p.push(ax,ay,az,bx,by,bz,cx,cy,cz);
  o.n.push(nx,ny,nz,nx,ny,nz,nx,ny,nz);
}
function quad(o,a,b,c,d){tri(o,a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);tri(o,a[0],a[1],a[2],c[0],c[1],c[2],d[0],d[1],d[2]);}
function fin(o){return{pos:new Float32Array(o.p),nrm:new Float32Array(o.n),vc:o.p.length/3};}
function mkBox(){const o=mb(),h=.5,V=[[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]];
  quad(o,V[4],V[5],V[6],V[7]);quad(o,V[1],V[0],V[3],V[2]);quad(o,V[5],V[1],V[2],V[6]);
  quad(o,V[0],V[4],V[7],V[3]);quad(o,V[3],V[7],V[6],V[2]);quad(o,V[4],V[0],V[1],V[5]);return fin(o);}
function mkCyl(n){const o=mb();for(let i=0;i<n;i++){const a=i/n*TAU,b=(i+1)/n*TAU;
  const x0=Math.cos(a)*.5,z0=Math.sin(a)*.5,x1=Math.cos(b)*.5,z1=Math.sin(b)*.5;
  quad(o,[x0,-.5,z0],[x1,-.5,z1],[x1,.5,z1],[x0,.5,z0]);
  tri(o,0,.5,0,x0,.5,z0,x1,.5,z1);tri(o,0,-.5,0,x1,-.5,z1,x0,-.5,z0);}return fin(o);}
function mkCone(n){const o=mb();for(let i=0;i<n;i++){const a=i/n*TAU,b=(i+1)/n*TAU;
  const x0=Math.cos(a)*.5,z0=Math.sin(a)*.5,x1=Math.cos(b)*.5,z1=Math.sin(b)*.5;
  tri(o,x0,-.5,z0,x1,-.5,z1,0,.5,0);tri(o,0,-.5,0,x1,-.5,z1,x0,-.5,z0);}return fin(o);}
function mkIco(){const t=(1+Math.sqrt(5))/2,V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]]
  .map(v=>{const l=Math.hypot(v[0],v[1],v[2]);return[v[0]/l*.5,v[1]/l*.5,v[2]/l*.5];});
  const F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
           [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const o=mb();for(const f of F)tri(o,V[f[0]][0],V[f[0]][1],V[f[0]][2],V[f[1]][0],V[f[1]][1],V[f[1]][2],V[f[2]][0],V[f[2]][1],V[f[2]][2]);
  return fin(o);}
function mkOcta(){const o=mb(),h=.5,V=[[0,h,0],[h,0,0],[0,0,h],[-h,0,0],[0,0,-h],[0,-h,0]];
  const F=[[0,2,1],[0,3,2],[0,4,3],[0,1,4],[5,1,2],[5,2,3],[5,3,4],[5,4,1]];
  for(const f of F)tri(o,V[f[0]][0],V[f[0]][1],V[f[0]][2],V[f[1]][0],V[f[1]][1],V[f[1]][2],V[f[2]][0],V[f[2]][1],V[f[2]][2]);
  return fin(o);}
function mkQuadXZ(){const o=mb();quad(o,[-.5,0,.5],[.5,0,.5],[.5,0,-.5],[-.5,0,-.5]);return fin(o);}
function mkRing(n,ri){const o=mb();for(let i=0;i<n;i++){const a=i/n*TAU,b=(i+1)/n*TAU;
  const c0=Math.cos(a),s0=Math.sin(a),c1=Math.cos(b),s1=Math.sin(b);
  quad(o,[c0*ri,0,s0*ri],[c1*ri,0,s1*ri],[c1*.5,0,s1*.5],[c0*.5,0,s0*.5]);}return fin(o);}
const MESH={};

/* ------------------------------ renderer --------------------------------- */
const cv=document.getElementById('gl');
const gl=cv.getContext('webgl',{antialias:true,alpha:false,powerPreference:'high-performance'})
       ||cv.getContext('experimental-webgl');
if(!gl){document.body.innerHTML='<div style="padding:24px;font:14px monospace;color:#dfe9ff">WebGL is required to play MERGE PROTOCOL.</div>';}
const VS=`attribute vec3 aPos;attribute vec3 aNrm;attribute vec4 aCol;uniform mat4 uVP;
varying vec3 vN;varying vec4 vC;varying vec3 vW;
void main(){vN=aNrm;vC=aCol;vW=aPos;gl_Position=uVP*vec4(aPos,1.0);}`;
const FS=`precision mediump float;varying vec3 vN;varying vec4 vC;varying vec3 vW;
uniform vec3 uCam;uniform float uMode;
void main(){
 if(uMode>1.5){gl_FragColor=vec4(vC.rgb,vC.a);return;}
 if(uMode>0.5){gl_FragColor=vec4(vC.rgb*vC.a,1.0);return;}
 vec3 n=normalize(vN);
 vec3 L=normalize(vec3(0.45,1.0,0.38));
 float d=max(dot(n,L),0.0);
 vec3 V=normalize(uCam-vW);
 float rim=pow(1.0-max(dot(n,V),0.0),2.6);
 vec3 hv=normalize(L+V);
 float sp=pow(max(dot(n,hv),0.0),26.0)*0.4;
 vec3 amb=mix(vec3(0.11,0.14,0.24),vec3(0.28,0.35,0.52),n.y*0.5+0.5);
 vec3 c=vC.rgb*(amb+d*vec3(1.0,0.96,0.88)*1.05)+sp+vC.rgb*rim*0.6+vC.rgb*vC.a*0.7;
 c=c/(1.0+c*0.30)*1.24;                  // soft highlight knee: keeps hue instead of clipping to white
 float fog=clamp((length(vW.xz)-8.6)/13.0,0.0,1.0);   // fog by board distance, not camera: zoom-stable
 c=mix(c,vec3(0.025,0.035,0.07),fog*0.8);
 gl_FragColor=vec4(c,1.0);}`;
let prog,uVP,uCam,uMode,aPos,aNrm,aCol;
function initGL(){
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh;};
  prog=gl.createProgram();gl.attachShader(prog,mk(gl.VERTEX_SHADER,VS));gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);gl.useProgram(prog);
  uVP=gl.getUniformLocation(prog,'uVP');uCam=gl.getUniformLocation(prog,'uCam');uMode=gl.getUniformLocation(prog,'uMode');
  aPos=gl.getAttribLocation(prog,'aPos');aNrm=gl.getAttribLocation(prog,'aNrm');aCol=gl.getAttribLocation(prog,'aCol');
  gl.enableVertexAttribArray(aPos);gl.enableVertexAttribArray(aNrm);gl.enableVertexAttribArray(aCol);
  gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.clearColor(.016,.024,.047,1);
  MESH.box=mkBox();MESH.cyl=mkCyl(10);MESH.cyl6=mkCyl(6);MESH.cone=mkCone(8);MESH.ico=mkIco();
  MESH.octa=mkOcta();MESH.quad=mkQuadXZ();MESH.ring=mkRing(28,.40);MESH.ring2=mkRing(28,.46);
}
const _R=new Float32Array(9);
function rotM(ry,rx,rz){
  const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),cz=Math.cos(rz),sz=Math.sin(rz);
  _R[0]=cy*cz+sy*sx*sz; _R[3]=-cy*sz+sy*sx*cz; _R[6]=sy*cx;
  _R[1]=cx*sz;          _R[4]=cx*cz;           _R[7]=-sx;
  _R[2]=-sy*cz+cy*sx*sz;_R[5]=sy*sz+cy*sx*cz;  _R[8]=cy*cx;
}
class Batch{
  constructor(){this.a=new Float32Array(20000*10);this.n=0;this.buf=gl.createBuffer();}
  reset(){this.n=0;}
  need(v){const w=(this.n+v)*10;if(w>this.a.length){let L=this.a.length;while(L<w)L*=2;
    const b=new Float32Array(L);b.set(this.a.subarray(0,this.n*10));this.a=b;}}
  add(m,x,y,z,sx,sy,sz,ry,rx,rz,c,e){
    const vc=m.vc;this.need(vc);rotM(ry,rx,rz);
    const R=_R,A=this.a,P=m.pos,N=m.nrm,r=c[0],g=c[1],b=c[2];let o=this.n*10;
    for(let i=0,j=0;i<vc;i++,j+=3){
      const px=P[j]*sx,py=P[j+1]*sy,pz=P[j+2]*sz;
      A[o]=R[0]*px+R[3]*py+R[6]*pz+x;A[o+1]=R[1]*px+R[4]*py+R[7]*pz+y;A[o+2]=R[2]*px+R[5]*py+R[8]*pz+z;
      const nx=N[j],ny=N[j+1],nz=N[j+2];
      A[o+3]=R[0]*nx+R[3]*ny+R[6]*nz;A[o+4]=R[1]*nx+R[4]*ny+R[7]*nz;A[o+5]=R[2]*nx+R[5]*ny+R[8]*nz;
      A[o+6]=r;A[o+7]=g;A[o+8]=b;A[o+9]=e;o+=10;}
    this.n+=vc;
  }
  s(m,x,y,z,sc,c,e){this.add(m,x,y,z,sc,sc,sc,0,0,0,c,e);}
  beam(ax,ay,az,bx,by,bz,w,c,e){
    const dx=bx-ax,dy=by-ay,dz=bz-az,L=Math.hypot(dx,dy,dz);if(L<1e-4)return;
    const rx=Math.asin(clamp(-dy/L,-1,1)),ry=Math.atan2(dx,dz);
    this.add(MESH.box,(ax+bx)/2,(ay+by)/2,(az+bz)/2,w,w,L,ry,rx,0,c,e);
  }
  bill(x,y,z,w,h,ox,c,al){
    this.need(6);const A=this.a;let o=this.n*10;
    const rx=CAM.rx,ry=CAM.ry,rz=CAM.rz,ux=CAM.ux,uy=CAM.uy,uz=CAM.uz;
    const cx=x+rx*ox,cy=y+ry*ox,cz=z+rz*ox,hw=w/2,hh=h/2;
    const V=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,-hh],[hw,hh],[-hw,hh]];
    for(let i=0;i<6;i++){const p=V[i];
      A[o]=cx+rx*p[0]+ux*p[1];A[o+1]=cy+ry*p[0]+uy*p[1];A[o+2]=cz+rz*p[0]+uz*p[1];
      A[o+3]=0;A[o+4]=1;A[o+5]=0;A[o+6]=c[0];A[o+7]=c[1];A[o+8]=c[2];A[o+9]=al;o+=10;}
    this.n+=6;
  }
  draw(mode){
    if(!this.n)return;
    gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);
    gl.bufferData(gl.ARRAY_BUFFER,this.a.subarray(0,this.n*10),gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,40,0);
    gl.vertexAttribPointer(aNrm,3,gl.FLOAT,false,40,12);
    gl.vertexAttribPointer(aCol,4,gl.FLOAT,false,40,24);
    gl.uniform1f(uMode,mode);
    gl.drawArrays(gl.TRIANGLES,0,this.n);
  }
}

/* ------------------------------- board ----------------------------------- */
const G=9,CS=1.2;
const cellX=c=>(c-(G-1)/2)*CS, cellZ=r=>(r-(G-1)/2)*CS;
const WP=[[-1.6,1],[7,1],[7,3],[1,3],[1,5],[7,5],[7,7],[9.6,7]];
function buildPath(pts,y){
  const P={pts:[],seg:[],total:0,y:y};
  for(const p of pts)P.pts.push({x:cellX(p[0]),z:cellZ(p[1])});
  for(let i=0;i<P.pts.length-1;i++){
    const a=P.pts[i],b=P.pts[i+1],dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);
    P.seg.push({ax:a.x,az:a.z,dx:dx/len,dz:dz/len,len,start:P.total,ang:Math.atan2(dx,dz)});
    P.total+=len;
  }
  return P;
}
const GPATH=buildPath(WP,0), APATH=buildPath([[-1.6,0],[9.6,8]],1.55);
const _pp={x:0,z:0,ang:0};
function pathAt(P,d){
  d=clamp(d,0,P.total);
  for(let i=0;i<P.seg.length;i++){const s=P.seg[i];
    if(d<=s.start+s.len||i===P.seg.length-1){const t=d-s.start;
      _pp.x=s.ax+s.dx*t;_pp.z=s.az+s.dz*t;_pp.ang=s.ang;return _pp;}}
  return _pp;
}
const PATHCELL=new Uint8Array(G*G);
(function markPath(){
  for(let d=0;d<GPATH.total;d+=0.12){const p=pathAt(GPATH,d);
    const c=Math.round(p.x/CS+(G-1)/2),r=Math.round(p.z/CS+(G-1)/2);
    if(c>=0&&c<G&&r>=0&&r<G)PATHCELL[r*G+c]=1;}
})();

/* ------------------------------- camera ---------------------------------- */
const FOV=0.95;
const CAM={yaw:0.55,pitch:1.02,zoom:1,dist:18.5,tx:0,tz:0,aimY:-0.3,shake:0,
  ex:0,ey:0,ez:0,rx:1,ry:0,rz:0,ux:0,uy:1,uz:0};
// Distance that just fits the rotated board in BOTH axes — keeps portrait phones playable.
function fitDist(){
  const asp=cv.width/cv.height||1, t=Math.tan(FOV/2);
  const Rh=6.3*(Math.abs(Math.cos(CAM.yaw))+Math.abs(Math.sin(CAM.yaw)));
  const Rv=Rh*1.05+1.0;
  return clamp(Math.max(Rh/(t*asp),Rv/t),11,46);
}
function resetCam(){
  const tall=(cv.width/cv.height||1)<0.85;
  CAM.yaw=tall?0.26:0.55;CAM.pitch=tall?1.06:1.02;CAM.zoom=1;CAM.aimY=tall?-1.7:-0.3;
  CAM.dist=fitDist();
}
const VP=new Float32Array(16),PM=new Float32Array(16),VM=new Float32Array(16),IVP=new Float32Array(16);
function updateCam(dt){
  CAM.shake=Math.max(0,CAM.shake-dt*3.2);
  CAM.dist=lerp(CAM.dist,fitDist()*CAM.zoom,Math.min(1,dt*7));
  const s=CAM.shake*CAM.shake*0.32;
  const sx=(Math.random()*2-1)*s, sy=(Math.random()*2-1)*s;
  const cp=Math.cos(CAM.pitch),sp=Math.sin(CAM.pitch);
  CAM.ex=CAM.tx+Math.sin(CAM.yaw)*cp*CAM.dist+sx;
  CAM.ey=sp*CAM.dist+sy;
  CAM.ez=CAM.tz+Math.cos(CAM.yaw)*cp*CAM.dist;
  m4persp(FOV,cv.width/cv.height,0.4,120,PM);
  m4look(CAM.ex,CAM.ey,CAM.ez,CAM.tx,CAM.aimY,CAM.tz,VM);
  m4mul(PM,VM,VP);m4inv(VP,IVP);
  CAM.rx=VM[0];CAM.ry=VM[4];CAM.rz=VM[8];
  CAM.ux=VM[1];CAM.uy=VM[5];CAM.uz=VM[9];
}
const _a=[0,0,0],_b=[0,0,0];
function screenToGround(px,py,planeY){
  const nx=px/cv.clientWidth*2-1, ny=1-py/cv.clientHeight*2;
  unproj(IVP,nx,ny,-1,_a);unproj(IVP,nx,ny,1,_b);
  const dy=_b[1]-_a[1];if(Math.abs(dy)<1e-6)return null;
  const t=(planeY-_a[1])/dy;if(t<0||t>1.4)return null;
  return{x:_a[0]+(_b[0]-_a[0])*t,z:_a[2]+(_b[2]-_a[2])*t};
}
function cellAt(px,py){
  const g=screenToGround(px,py,0.1);if(!g)return -1;
  const c=Math.round(g.x/CS+(G-1)/2),r=Math.round(g.z/CS+(G-1)/2);
  if(c<0||c>=G||r<0||r>=G)return -1;
  if(Math.abs(g.x-cellX(c))>CS*.58||Math.abs(g.z-cellZ(r))>CS*.58)return -1;
  return r*G+c;
}

  boot(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  tone(f,d,type,g,f2){
    if(!this.on||!this.ctx)return;const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),v=this.ctx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g||0.06,t+0.008);
    v.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(v);v.connect(this.ctx.destination);o.start(t);o.stop(t+d+0.02);
  },

function threatMul(){return 1+0.30*RUN.threat;}
function hpScale(){return Math.pow(1.115,RUN.wave-1)*threatMul()*(RUN.deceived?1.25:1)*(RUN.overclock?1.4:1);}

/* ------------------------------ economy ---------------------------------- */
function addGold(n){RUN.gold=Math.max(0,RUN.gold+n);if(RUN.gold>RUN.maxGold)RUN.maxGold=RUN.gold;syncHud();}
function towerCount(){return RUN.towers.length;}
function rollShop(free){
  const m=RUN.mods,types=unlockedTypes(),n=m.shop,out=[];
  for(let i=0;i<n;i++){
    const t=pick(types);
    let tier=1;
    if(m.proto&&Math.random()<Math.min(.28,.06+RUN.wave*.012))tier=2;
    out.push({type:t,tier,cost:Math.ceil(TD[t].cost*(tier===2?2.4:1))});
  }
  RUN.offers=out;if(free)RUN.rolls=0;
  buildShop();
}
function rerollCost(){return RUN.rolls<RUN.mods.freeRoll?0:2;}

/* ------------------------------ towers ----------------------------------- */
function placeTower(type,tier,ci){
  const t={id:RUN.nextId++,type,tier,c:ci%G,r:(ci/G)|0,cd:0,ang:0,tgt:0,heat:0,kills:0,pop:1,
           bDmg:1,bRng:1,fireT:-9};
  RUN.towers.push(t);RUN.cells[ci]=t.id;
  RUN.usedType[type]=1;if(tier>RUN.maxTier)RUN.maxTier=tier;
  recalcBuffs();return t;
}
function towerById(id){for(const t of RUN.towers)if(t.id===id)return t;return null;}
function removeTower(t){
  RUN.cells[t.r*G+t.c]=-1;
  const i=RUN.towers.indexOf(t);if(i>=0)RUN.towers.splice(i,1);
  recalcBuffs();
}
function recalcBuffs(){
  for(const t of RUN.towers){t.bDmg=1;t.bRng=1;}
  const m=RUN.mods;
  for(const n of RUN.towers){
    if(TD[n.type].kind==='support'){
      const R=(TD.nexus.rng+0.26*(n.tier-1))*m.nexusR;
      const nx=cellX(n.c),nz=cellZ(n.r);
      for(const t of RUN.towers){
        if(t===n||TD[t.type].kind==='support')continue;
        if(Math.hypot(cellX(t.c)-nx,cellZ(t.r)-nz)<=R){
          t.bDmg+=0.20*n.tier*m.nexus;t.bRng+=0.12*n.tier*m.nexus;
        }
      }
    }
  }
  if(m.adj>0){
    for(const t of RUN.towers){let n=0;
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      for(const d of dirs){const c=t.c+d[0],r=t.r+d[1];
        if(c>=0&&c<G&&r>=0&&r<G&&RUN.cells[r*G+c]>=0)n++;}
      t.bDmg+=m.adj*n;
    }
  }
}
function canMerge(a,b){return a&&b&&a!==b&&a.type===b.type&&a.tier===b.tier&&a.tier<5;}
function doMerge(a,b){ // a merges INTO b
  removeTower(a);
  b.tier++;b.pop=1.6;
  if(b.tier>RUN.maxTier)RUN.maxTier=b.tier;
  RUN.merges++;META.merges++;
  const now=RUN.clock||0;
  RUN.mergeCombo=(now-RUN.mergeT<4.5)?RUN.mergeCombo+1:1;RUN.mergeT=now;
  const m=RUN.mods;
  let g=m.mergeGold+Math.max(0,RUN.mergeCombo-1);
  if(g>0)addGold(g);
  if(m.mastery)RUN.typeMul[b.type]+=m.mastery;
  burst(cellX(b.c),0.6,cellZ(b.r),TD[b.type].col,26,2.4);
  CAM.shake=Math.max(CAM.shake,.55);SFX.merge();
  toast((RUN.mergeCombo>1?'MERGE ×'+RUN.mergeCombo+' — ':'MERGE — ')+TD[b.type].nm+' T'+b.tier+
        (g>0?'  +'+g+'◈':''),'good',RUN.mergeCombo>2);
  recalcBuffs();syncHud();refreshSel();
}
function sellTower(t){
  const g=tSell(t);addGold(g);
  burst(cellX(t.c),0.5,cellZ(t.r),PAL.gold,14,1.6);
  removeTower(t);RUN.sel=null;SFX.buy();toast('SALVAGED +'+g+'◈');syncHud();refreshSel();
}

/* ------------------------------ commander -------------------------------- */
// Commander plays a repeated 3x3 matching-pennies-like game and best-responds to
// the player's empirical doctrine frequencies. Pure strategies get punished.
function commanderAdapt(){return Math.min(.82,.30+.042*RUN.wave);}
function commanderPick(){
  const h=RUN.hist,total=h.pierce+h.scatter+h.flak;
  const cats=['ARMOR','SWARM','AIR'];
  if(total>0&&Math.random()<commanderAdapt()){
    let bestK=DKEYS[0],bestV=-1;
    for(const k of DKEYS){const v=h[k]+Math.random()*0.4;if(v>bestV){bestV=v;bestK=k;}}
    const avoid=DOCTRINE[bestK].beats;
    const opts=cats.filter(c=>c!==avoid);
    return pick(opts);
  }
  return pick(cats);
}
function chooseDoctrine(k){
  RUN.doctrine=k;RUN.hist[k]++;
  RUN.countered=DOCTRINE[k].beats===RUN.legion;
  RUN.deceived=!RUN.countered;
  if(RUN.countered){
    RUN.counters++;
    const g=4+RUN.mods.counterGold;addGold(g);
    toast('COUNTERED — '+DOCTRINE[k].nm+' vs '+RUN.legion+' LEGION  +'+g+'◈','good',true);
    SFX.good();
  }else{
    toast('OUTPLAYED — '+RUN.legion+' LEGION: enemies +25% HP','bad',true);
    SFX.leak();
  }
  buildWave();
  RUN.phase='prep';
  closeModal();syncHud();buildShop();
  showHint(RUN.wave===1?'TAP a shop card, then TAP a tile to deploy':'');
}
function doctrineMul(e){
  if(!RUN.doctrine)return 1;
  return DOCTRINE[RUN.doctrine].beats===ED[e.kind].cat?1.45:0.9;
}

/* ------------------------------- waves ----------------------------------- */
function buildWave(){
  const n=RUN.wave,legion=RUN.legion,Q=[];
  let budget=4+n*1.7+Math.pow(n,1.4)*0.5;
  const boss=n%5===0;
  if(boss){Q.push({kind:BOSSCAT[legion],t:0.6});budget*=0.55;}
  const main=BYCAT[legion],others=['SWARM','ARMOR','AIR'].filter(c=>c!==legion);
  let t=0;
  const gap=Math.max(.20,.72-n*.013);
  let guard=0;
  while(budget>0.8&&guard++<400){
    const useMain=Math.random()<0.72;
    const cat=useMain?legion:pick(others);
    const poolAll=BYCAT[cat].filter(k=>ED[k].cost<=budget+1.2||ED[k].cost<=2);
    const pool=poolAll.length?poolAll:BYCAT[cat];
    // bias to tougher units later
    let k=pick(pool);
    if(n>6&&Math.random()<.45){let best=k;for(const c of pool)if(ED[c].cost>ED[best].cost)best=c;k=best;}
    Q.push({kind:k,t:t});
    budget-=ED[k].cost;
    t+=gap*(0.65+Math.random()*0.8)*(ED[k].cost>3?1.5:1);
  }
  Q.sort((a,b)=>a.t-b.t);
  RUN.spawnQ=Q;RUN.spawnT=0;
}
function wavePreview(){
  const c={};for(const q of RUN.spawnQ)c[q.kind]=(c[q.kind]||0)+1;
  return Object.keys(c).map(k=>({k,n:c[k]})).sort((a,b)=>ED[b.k].cost-ED[a.k].cost);
}
function startWave(){
  if(RUN.phase!=='prep')return;
  RUN.phase='combat';SFX.wave();
  toast('WAVE '+RUN.wave+' INBOUND'+(RUN.overclock?' — OVERCLOCKED':''),'bad',true);
  showHint('');syncHud();
}
function spawnEnemy(kind){
  const d=ED[kind],P=d.fly?APATH:GPATH;
  // early bosses are softened so wave 5 is a check, not a wall
  const hp0=d.hp*hpScale()*(d.boss?clamp(0.35+RUN.wave*0.05,0.4,1.5):1);
  const e={id:RUN.nextId++,kind,hp:hp0,max:hp0,d:0,y:P.y,
    spd:d.spd*Math.min(1.5,1+RUN.wave*.017),slow:0,slowT:0,pois:0,poisT:0,poisS:0,
    armor:(d.armor||0)+(d.boss?RUN.wave*0.3:0),aura:0,fly:d.fly?1:0,path:P,ph:Math.random()*TAU,
    dead:false,hitT:0,spawnT:0,boss:d.boss?1:0,sp:0,_x:0,_z:0,ang:0};
  const p0=pathAt(P,0);e._x=p0.x;e._z=p0.z;e.ang=p0.ang;
  RUN.enemies.push(e);
  if(d.boss){SFX.boss();CAM.shake=1;toast('⚠ '+d.nm+' DETECTED','bad',true);}
  return e;
}
function nextWave(){
  RUN.wave++;
  RUN.legionPrev=RUN.legion;
  RUN.legion=commanderPick();
  RUN.recon=!!RUN.mods.intel;
  RUN.doctrine=null;RUN.countered=false;RUN.deceived=false;
  rollShop(true);
  RUN.phase='doctrine';
  showDoctrine();
}
function waveCleared(){
  const m=RUN.mods;
  RUN.minTowersAtClear=Math.min(RUN.minTowersAtClear,RUN.towers.length);
  let inc=m.income+Math.floor(RUN.wave*0.5),intr=Math.min(m.icap,Math.floor(RUN.gold*m.interest));
  let total=inc+intr;
  if(RUN.overclock)total*=2;
  addGold(total);
  toast('WAVE '+RUN.wave+' CLEARED  +'+total+'◈'+(intr?' (interest '+intr+')':''),'good',true);
  SFX.good();
  if(RUN.wave>META.best){META.best=RUN.wave;saveMeta();}
  const draftDue=(RUN.wave<=3)||(RUN.wave%2===1)||(RUN.wave%5===0);
  if(draftDue){RUN.phase='draft';showDraft();}
  else nextWave();
}

/* ------------------------------ combat ----------------------------------- */
function damage(e,amt,o){
  if(e.dead)return;
  o=o||{};
  const m=RUN.mods;
  let d=amt*doctrineMul(e);
  if(!o.noArmor){let ar=e.armor+e.aura;if(RUN.doctrine==='pierce')ar*=0.4;d=Math.max(d*0.14,d-ar);}
  if(m.frostbite&&e.slowT>0)d*=1+m.frostbite;
  if(m.exec&&e.hp/e.max<0.30)d*=1+m.exec;
  if(m.bossDmg&&e.boss)d*=1+m.bossDmg;
  e.hp-=d;e.hitT=0.12;
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return;
  e.dead=true;
  const d=ED[e.kind];
  RUN.kills++;META.kills++;
  addGold(Math.max(1,Math.round(d.gold*RUN.mods.killGold*(1+RUN.wave*0.05))));
  burst(pxOf(e),e.y+d.sz*0.6,pzOf(e),d.col,d.boss?60:12,d.boss?4:1.5);
  if(d.boss){CAM.shake=1.2;SFX.over();}else SFX.kill();
  if(d.split){for(let i=0;i<d.split;i++){const s=spawnEnemy('grunt');s.d=Math.max(0,e.d-i*0.28);}}
  if(RUN.mods.vamp){RUN.vampCount++;if(RUN.vampCount>=RUN.mods.vamp){RUN.vampCount=0;
    if(RUN.lives<RUN.maxLives){RUN.lives++;toast('CORE REPAIRED +1','good');}}}
}
const pxOf=e=>e._x,pzOf=e=>e._z;
function leak(e){
  const d=ED[e.kind];
  e.dead=true;RUN.lives-=d.leak;
  CAM.shake=Math.max(CAM.shake,.8);SFX.leak();
  toast('CORE BREACH −'+d.leak,'bad');
  if(RUN.lives<=0){RUN.lives=0;gameOver();}
  syncHud();
}
function burst(x,y,z,c,n,pw){
  for(let i=0;i<n;i++){
    if(RUN.parts.length>420)break;
    const a=Math.random()*TAU,el=Math.random()*PI*0.6;
    const s=(0.9+Math.random()*2.4)*(pw||1);
    RUN.parts.push({x,y,z,vx:Math.cos(a)*Math.cos(el)*s,vy:Math.sin(el)*s+1.2,vz:Math.sin(a)*Math.cos(el)*s,
      life:0.45+Math.random()*0.5,t:0,c,sz:0.045+Math.random()*0.07});
  }
}
function beam(ax,ay,az,bx,by,bz,c,w,life){RUN.beams.push({ax,ay,az,bx,by,bz,c,w,t:0,life:life||0.16});}

function acquire(t,tx,tz,rng){
  const d=TD[t.type];let best=null,bd=-1;
  for(const e of RUN.enemies){
    if(e.dead||e.spawnT>0)continue;
    if(d.ground&&e.fly)continue;
    const dx=e._x-tx,dz=e._z-tz;
    if(dx*dx+dz*dz>rng*rng)continue;
    if(e.d>bd){bd=e.d;best=e;}
  }
  return best;
}
function stepTowers(dt){
  const m=RUN.mods;
  for(const t of RUN.towers){
    const d=TD[t.type];
    t.pop=lerp(t.pop,1,dt*7);
    const tx=cellX(t.c),tz=cellZ(t.r);
    if(d.kind==='support'){t.ang+=dt*0.7;continue;}
    const rng=tRng(t)*m.rng*t.bRng;
    let e=t.tgt?RUN.enemies.find(q=>q.id===t.tgt&&!q.dead):null;
    if(e){const dx=e._x-tx,dz=e._z-tz;if(dx*dx+dz*dz>rng*rng*1.04||(d.ground&&e.fly))e=null;}
    if(!e){e=acquire(t,tx,tz,rng);t.tgt=e?e.id:0;if(!e){t.heat=Math.max(0,t.heat-dt*1.2);continue;}}
    const ang=Math.atan2(e._x-tx,e._z-tz);
    let da=((ang-t.ang+PI*3)%TAU)-PI;t.ang+=da*Math.min(1,dt*11);
    let dmg=tDmg(t)*m.dmg*RUN.typeMul[t.type]*t.bDmg;
    if(m.zeal&&t.tier>=4)dmg*=1+m.zeal;
    if(d.kind==='beam'){
      t.heat=Math.min(1,t.heat+dt*0.42);
      const mult=1+t.heat*1.5;
      damage(e,dmg*mult*dt,{noArmor:true});
      t.fireT=RUN.clock;
      beam(tx,0.72+t.tier*0.07,tz,e._x,e.y+ED[e.kind].sz*0.4,e._z,d.col,0.035+t.heat*0.05,0.05);
      if(Math.random()<dt*10)SFX.shoot();
      continue;
    }
    t.cd-=dt;
    if(t.cd>0)continue;
    t.cd=1/(tRate(t)*m.rate);
    t.fireT=RUN.clock;
    SFX.shoot();
    const my=0.66+t.tier*0.08;
    const mx=tx+Math.sin(t.ang)*0.34, mz=tz+Math.cos(t.ang)*0.34;
    if(d.kind==='proj'){
      RUN.projs.push({x:mx,y:my,z:mz,tgt:e.id,sp:11,dmg,type:t.type,c:d.col,life:2.2,pierce:m.pierce,hitIds:null,arc:0});
    }else if(d.kind==='arc'){
      RUN.projs.push({x:mx,y:my,z:mz,tgt:e.id,sp:8,dmg,type:t.type,c:d.col,life:3,arc:1,
        splash:d.splash*m.splash,t0:0,px:e._x,pz:e._z,pd:Math.hypot(e._x-mx,e._z-mz)});
    }else if(d.kind==='chain'){
      let cur=e,hit=[],hops=(d.chain+m.chain),dd=dmg;
      let ax=mx,ay=my,az=mz;
      for(let i=0;i<hops&&cur;i++){
        beam(ax,ay,az,cur._x,cur.y+0.2,cur._z,d.col,0.05,0.2);
        damage(cur,dd,{});hit.push(cur.id);dd*=0.78;
        ax=cur._x;ay=cur.y+0.2;az=cur._z;
        let nx=null,nd=1e9;
        for(const q of RUN.enemies){if(q.dead||hit.indexOf(q.id)>=0||q.spawnT>0)continue;
          const dx=q._x-ax,dz=q._z-az,l=dx*dx+dz*dz;if(l<5.3&&l<nd){nd=l;nx=q;}}
        cur=nx;
      }
    }else if(d.kind==='line'){
      const dx=Math.sin(t.ang),dz=Math.cos(t.ang),L=rng+1.2;
      beam(mx,my,mz,mx+dx*L,my,mz+dz*L,d.col,0.055,0.22);
      for(const q of RUN.enemies){
        if(q.dead||q.fly||q.spawnT>0)continue;
        const rx=q._x-mx,rz=q._z-mz,proj=rx*dx+rz*dz;
        if(proj<0||proj>L)continue;
        const perp=Math.abs(rx*dz-rz*dx);
        if(perp<0.42+ED[q.kind].sz)damage(q,dmg,{});
      }
      CAM.shake=Math.max(CAM.shake,.22);
    }
  }
}
function stepProjs(dt){
  const P=RUN.projs;
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.life-=dt;
    const e=RUN.enemies.find(q=>q.id===p.tgt&&!q.dead);
    if(p.arc){
      p.t0+=dt;
      const tx=e?e._x:p.px, tz=e?e._z:p.pz;
      p.px=tx;p.pz=tz;
      const dx=tx-p.x,dz=tz-p.z,dist=Math.hypot(dx,dz);
      const step=p.sp*dt;
      if(dist<=step||p.life<=0){
        const d=TD[p.type];
        const R=p.splash;
        for(const q of RUN.enemies){
          if(q.dead||q.fly)continue;
          const l=Math.hypot(q._x-tx,q._z-tz);
          if(l<R)damage(q,p.dmg*(1-0.4*l/R),{});
        }
        burst(tx,0.12,tz,d.col,16,1.6);CAM.shake=Math.max(CAM.shake,.18);SFX.hit();
        P.splice(i,1);continue;
      }
      p.x+=dx/dist*step;p.z+=dz/dist*step;
      const total=p.pd||1,prog=clamp(1-dist/total,0,1);
      p.y=0.6+Math.sin(prog*PI)*(1.1+total*0.14);
      continue;
    }
    if(!e){P.splice(i,1);continue;}
    const dx=e._x-p.x,dy=(e.y+ED[e.kind].sz*0.4)-p.y,dz=e._z-p.z;
    const dist=Math.hypot(dx,dy,dz),step=p.sp*dt;
    if(dist<=step+ED[e.kind].sz*0.6||p.life<=0){
      const d=TD[p.type];
      if(d.slow){e.slow=Math.max(e.slow,d.slow);e.slowT=d.slowT;}
      if(d.poison){e.poisS=Math.min(d.pstack,e.poisS+1);e.pois=d.poison*e.poisS;e.poisT=3;}
      damage(e,p.dmg,{noArmor:!!d.poison});
      burst(e._x,e.y+0.15,e._z,d.col,4,0.8);SFX.hit();
      if(p.pierce>0){
        p.pierce--;let nx=null,nd=1e9;
        for(const q of RUN.enemies){if(q.dead||q.id===e.id)continue;
          const l=Math.hypot(q._x-p.x,q._z-p.z);if(l<2.6&&l<nd){nd=l;nx=q;}}
        if(nx){p.tgt=nx.id;p.life=1.2;continue;}
      }
      P.splice(i,1);continue;
    }
    p.x+=dx/dist*step;p.y+=dy/dist*step;p.z+=dz/dist*step;
  }
}
function stepEnemies(dt){
  // warden aura refresh
  RUN.auraT=(RUN.auraT||0)-dt;
  if(RUN.auraT<=0){
    RUN.auraT=0.25;
    for(const e of RUN.enemies)e.aura=0;
    for(const w of RUN.enemies){
      const d=ED[w.kind];if(!d.aura||w.dead)continue;
      for(const e of RUN.enemies){if(e===w||e.dead)continue;
        if(Math.hypot(e._x-w._x,e._z-w._z)<2.1)e.aura=Math.max(e.aura,d.aura);}
    }
  }
  for(let i=RUN.enemies.length-1;i>=0;i--){
    const e=RUN.enemies[i];
    if(e.dead){RUN.enemies.splice(i,1);continue;}
    const d=ED[e.kind];
    if(e.hitT>0)e.hitT-=dt;
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=0;}
    if(e.poisT>0){e.poisT-=dt;damage(e,e.pois*dt,{noArmor:true});
      if(e.poisT<=0){e.poisS=0;e.pois=0;}
      if(e.dead){RUN.enemies.splice(i,1);continue;}}
    if(d.spawner){e.sp-=dt;if(e.sp<=0){e.sp=2.6;const s=spawnEnemy('grunt');s.d=e.d;}}
    e.d+=e.spd*(1-e.slow)*dt;
    const p=pathAt(e.path,e.d);
    e._x=p.x;e._z=p.z;e.ang=p.ang;
    e.y=e.path.y+(e.fly?Math.sin(RUN.clock*2+e.ph)*0.12:0);
    if(e.d>=e.path.total){leak(e);RUN.enemies.splice(i,1);}
  }
}
function stepFx(dt){
  for(let i=RUN.parts.length-1;i>=0;i--){const p=RUN.parts[i];
    p.t+=dt;if(p.t>=p.life){RUN.parts.splice(i,1);continue;}
    p.vy-=7*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.y<0.03){p.y=0.03;p.vy*=-0.35;p.vx*=0.7;p.vz*=0.7;}}
  for(let i=RUN.beams.length-1;i>=0;i--){const b=RUN.beams[i];b.t+=dt;if(b.t>=b.life)RUN.beams.splice(i,1);}
}
function step(dt){
  RUN.clock=(RUN.clock||0)+dt;
  if(RUN.phase==='combat'){
    RUN.spawnT+=dt;
    while(RUN.spawnQ.length&&RUN.spawnQ[0].t<=RUN.spawnT){spawnEnemy(RUN.spawnQ.shift().kind);}
    stepEnemies(dt);stepTowers(dt);stepProjs(dt);
    if(!RUN.spawnQ.length&&!RUN.enemies.length&&RUN.phase==='combat'){waveCleared();}
  }else if(RUN.phase==='prep'){
    stepTowers(dt);stepProjs(dt);
  }
  stepFx(dt);
}

/* ------------------------------ game over -------------------------------- */
function gameOver(){
  if(RUN.phase==='over')return;
  RUN.phase='over';
  RUN.contractDone=RUN.contract.ck(RUN);
  let a=Math.floor((Math.pow(RUN.wave,1.7)*0.5+RUN.kills*0.08+RUN.merges*0.4)*(1+0.35*RUN.threat));
  if(RUN.contractDone)a+=RUN.contract.pay;
  RUN.alloyEarned=a;
  META.alloy+=a;META.runs++;
  if(RUN.wave>=15&&META.maxThreat<RUN.threat+1){META.maxThreat=RUN.threat+1;}
  saveMeta();SFX.over();
  showOver();
}

function buildWorld(){
  BW=new Batch();
  for(let r=0;r<G;r++)for(let c=0;c<G;c++){
    const x=cellX(c),z=cellZ(r),p=PATHCELL[r*G+c];
    const col=p?PAL.path:((c+r)&1?PAL.tile:PAL.tileB);
    BW.add(MESH.box,x,p?0.04:0.06,z,CS*.94,p?0.08:0.12,CS*.94,0,0,0,col,p?0.09:0.015);
  }
  // path direction chevrons
  for(let d=CS*0.9;d<GPATH.total-CS*0.6;d+=CS*1.35){
    const p=pathAt(GPATH,d);
    BW.add(MESH.cone,p.x,0.13,p.z,0.26,0.1,0.42,p.ang,-PI/2,0,PAL.arrow,0.5);
  }
  // rim wall
  const H=0.42,hw=G*CS/2+0.16;
  for(let i=0;i<G;i++){
    const x=cellX(i),z=cellZ(i);
    if(!PATHCELL[i]) BW.add(MESH.box,x,H/2,-hw,CS*.96,H,0.16,0,0,0,PAL.wall,0.03);
    if(!PATHCELL[(G-1)*G+i]) BW.add(MESH.box,x,H/2,hw,CS*.96,H,0.16,0,0,0,PAL.wall,0.03);
    if(!PATHCELL[i*G]) BW.add(MESH.box,-hw,H/2,z,0.16,H,CS*.96,0,0,0,PAL.wall,0.03);
    if(!PATHCELL[i*G+G-1]) BW.add(MESH.box,hw,H/2,z,0.16,H,CS*.96,0,0,0,PAL.wall,0.03);
  }
  // portal (entry) and core (exit)
  const en=GPATH.pts[0], ex=GPATH.pts[GPATH.pts.length-1];
  for(let i=0;i<3;i++)BW.add(MESH.ring2,en.x,0.1+i*0.22,en.z,0.9-i*0.12,1,0.9-i*0.12,0,0,0,PAL.portal,0.6);
  BW.add(MESH.box,ex.x+0.3,0.5,ex.z,0.7,1.0,1.5,0,0,0,PAL.metal,0.02);
  BW.add(MESH.octa,ex.x+0.3,1.35,ex.z,0.55,0.55,0.55,0,0,0,PAL.base,0.75);
  BW.add(MESH.ring2,ex.x+0.3,0.06,ex.z,1.5,1,1.5,0,0,0,PAL.base,0.35);
  // ambient pillars outside the board for depth

  }
  BD=new Batch();BG=new Batch();BA=new Batch();
}

    BD.add(MESH.octa,x,y+s*0.9+bob,z,s*1.5,s*2.0,s*1.5,e.ang,0,RUN.clock*2+e.ph,cl,em+0.25);

  if(!e.fly)BA.add(MESH.quad,x,0.115,z,s*2.4,1,s*2.4,0,0,0,[0,0,0],0.34);
  // hp bar
  if(e.hp<e.max-0.01||d.boss){

function render(rdt){
  gl.viewport(0,0,cv.width,cv.height);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(uVP,false,VP);
  gl.uniform3f(uCam,CAM.ex,CAM.ey,CAM.ez);
  BD.reset();BG.reset();BA.reset();
  for(const t of RUN.towers)drawTower(t);
  for(const e of RUN.enemies)drawEnemy(e);
  for(const p of RUN.projs){
    const k=1-p.life/3;
    BG.s(MESH.ico,p.x,p.y,p.z,p.arc?0.16:0.11,p.c,1);
    BG.beam(p.x,p.y,p.z,p.x-(p.vx||0),p.y,p.z,0.05,p.c,0.5);
  }
  for(const b of RUN.beams){
    const k=1-b.t/b.life;
    BG.beam(b.ax,b.ay,b.az,b.bx,b.by,b.bz,b.w*(0.4+k),b.c,0.85*k+0.15);
  }
  for(const p of RUN.parts){
    const k=1-p.t/p.life;
    BG.s(MESH.box,p.x,p.y,p.z,p.sz*(0.4+k),p.c,k);
  }
  drawDecals();
  gl.depthMask(true);gl.disable(gl.BLEND);
  BW.draw(0);BD.draw(0);
  gl.enable(gl.BLEND);gl.depthMask(false);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  BA.draw(2);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  BG.draw(1);
  gl.depthMask(true);gl.disable(gl.BLEND);
}

  const d=document.createElement('div');

const ptrs=new Map();let dragged=false,pinchD=0,lastX=0,lastY=0;
function tap(px,py){
  if(RUN.phase==='menu'||RUN.phase==='over'||RUN.phase==='doctrine'||RUN.phase==='draft')return;
  const ci=cellAt(px,py);
  const s=RUN.sel;
  if(ci<0){RUN.sel=null;buildShop();refreshSel();showHint('');return;}
  const occ=RUN.cells[ci];
  if(s&&s.k==='buy'){
    if(PATHCELL[ci]||occ>=0){toast('BLOCKED','bad');return;}
    const o=RUN.offers[s.i];
    if(RUN.gold<o.cost){toast('NOT ENOUGH ◈','bad');return;}
    if(RUN.towers.length>=RUN.mods.cap){toast('UNIT CAP REACHED','bad');return;}
    addGold(-o.cost);
    const t=placeTower(o.type,o.tier,ci);
    RUN.offers.splice(s.i,1);RUN.sel=null;
    burst(cellX(t.c),0.4,cellZ(t.r),TD[t.type].col,10,1.1);
    SFX.place();buildShop();refreshSel();syncHud();showHint('');
    if(RUN.wave===1&&RUN.towers.length===2)showHint('Two twins? TAP one, then TAP the other to MERGE');
    return;
  }
  if(s&&s.k==='tower'){
    const a=towerById(s.id);
    if(!a){RUN.sel=null;refreshSel();return;}
    if(occ===a.id){RUN.sel=null;buildShop();refreshSel();showHint('');return;}
    if(occ>=0){
      const b=towerById(occ);
      if(canMerge(a,b)){doMerge(a,b);RUN.sel={k:'tower',id:b.id};refreshSel();return;}
      RUN.sel={k:'tower',id:b.id};refreshSel();SFX.ui();return;
    }
    if(PATHCELL[ci]){toast('CONDUIT — cannot build','bad');return;}
    RUN.cells[a.r*G+a.c]=-1;a.c=ci%G;a.r=(ci/G)|0;RUN.cells[ci]=a.id;
    a.pop=1.35;recalcBuffs();SFX.place();refreshSel();return;
  }
  if(occ>=0){RUN.sel={k:'tower',id:occ};SFX.ui();buildShop();refreshSel();
    if(RUN.wave<=2)showHint('Gold rings = mergeable twins · empty tiles = relocate');return;}
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});
  if(ptrs.size===1){dragged=false;lastX=e.clientX;lastY=e.clientY;}
  if(ptrs.size===2){const p=[...ptrs.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);dragged=true;}
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){HOVER=cellAt(e.clientX,e.clientY);return;}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size>=2){
    const q=[...ptrs.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);
    if(pinchD)CAM.zoom=clamp(CAM.zoom*(pinchD/d),0.5,1.9);
    pinchD=d;return;
  }
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  if(Math.abs(e.clientX-p.x0)+Math.abs(e.clientY-p.y0)>11)dragged=true;
  if(dragged){
    CAM.yaw-=dx*0.006;
    CAM.pitch=clamp(CAM.pitch+dy*0.005,0.28,1.45);
  }
  HOVER=cellAt(e.clientX,e.clientY);
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);
  if(p&&!dragged&&ptrs.size===1)tap(e.clientX,e.clientY);
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinchD=0;
  if(ptrs.size===0)dragged=false;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinchD=0;});
cv.addEventListener('wheel',e=>{e.preventDefault();CAM.zoom=clamp(CAM.zoom*(1+Math.sign(e.deltaY)*0.09),0.5,1.9);},{passive:false});

  if(e.key===' '){e.preventDefault();if(RUN.phase==='prep')startWave();}
  if(e.key==='1'||e.key==='2'||e.key==='3'){RUN.speed=+e.key;syncHud();}
  if(e.key==='r'||e.key==='R')$('bReroll').click();
  if(e.key==='Escape'){RUN.sel=null;buildShop();refreshSel();showHint('');}
});
/* -------------------------------- boot ----------------------------------- */
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.floor(cv.clientWidth*dpr);cv.height=Math.floor(cv.clientHeight*dpr);
  const tall=cv.width/cv.height<0.85;
  CAM.aimY=tall?-1.7:-0.3;
}
addEventListener('resize',resize);
function startRun(){
  newRun();
  buildShop();refreshSel();syncHud();
  RUN.clock=0;
  nextWave();
}
let last=performance.now(),acc=0,hudT=0;
function frame(now){
  let rdt=(now-last)/1000;last=now;
  if(rdt>0.25)rdt=0.25;
  const running=RUN.phase==='combat'||RUN.phase==='prep';
  const mul=RUN.phase==='combat'?RUN.speed:1;
  acc+=rdt*(running?mul:0);
  let guard=0;
  while(acc>1/60&&guard++<8){step(1/60);acc-=1/60;}
  if(!running){RUN.clock=(RUN.clock||0)+rdt;stepFx(rdt);}
  updateCam(rdt);
  render(rdt);
  hudT+=rdt;
  if(hudT>0.12){hudT=0;syncHud();}
  requestAnimationFrame(frame);
}
function boot(){
  loadMeta();
  SFX.on=!META.mute;$('bSound').textContent=SFX.on?'♪':'✕';
  initGL();buildWorld();resize();resetCam();
  Object.assign(RUN,{phase:'menu',towers:[],enemies:[],projs:[],parts:[],beams:[],spawnQ:[],
    cells:new Int32Array(G*G).fill(-1),mods:freshMods(),typeMul:{},relics:[],clock:0,
    wave:0,gold:0,lives:0,speed:1,sel:null,threat:META.threat,offers:[],hist:{pierce:0,scatter:0,flak:0}});
  TKEYS.forEach(k=>RUN.typeMul[k]=1);
  syncHud();showMenu();
  requestAnimationFrame(frame);
  META.seenTut=true;saveMeta();
}
try{boot();}catch(err){
  document.body.innerHTML='<div style="padding:24px;font:13px monospace;color:#ff8fa6;white-space:pre-wrap">'+
    'MERGE PROTOCOL failed to start:\n'+(err&&err.stack||err)+'</div>';
}
</script>
</body>
</html>

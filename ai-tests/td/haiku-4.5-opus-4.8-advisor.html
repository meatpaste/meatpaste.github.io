<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge & Defend</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #0a0e27;
            color: #fff;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hud {
            position: absolute;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #4a9eff;
        }

        #topLeft {
            top: 15px;
            left: 15px;
            font-size: 16px;
            line-height: 1.6;
        }

        #topRight {
            top: 15px;
            right: 15px;
            text-align: right;
            font-size: 16px;
            line-height: 1.6;
        }

        #bottom {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .stat {
            display: inline-block;
            margin: 0 10px;
            font-weight: bold;
        }

        .stat.currency {
            color: #ffd700;
        }

        .stat.health {
            color: #ff6b6b;
        }

        .stat.wave {
            color: #4a9eff;
        }

        .stat.prestige {
            color: #a366ff;
        }

        #towerButtons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 2px solid #4a9eff;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
            pointer-events: auto;
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        button:active {
            transform: scale(0.95);
        }

        button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            z-index: 1000;
            border: 3px solid #ffd700;
            pointer-events: auto;
            min-width: 300px;
        }

        #gameOver h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ffd700;
        }

        #gameOver p {
            font-size: 18px;
            margin: 10px 0;
        }

        #gameOver button {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            font-size: 16px;
        }

        .tower-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 11px;
            border: 1px solid #4a9eff;
            white-space: nowrap;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
        }

        #touchHint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #888;
            text-align: center;
            pointer-events: none;
        }

        .pulse {
            animation: pulse 0.5s ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @media (max-width: 768px) {
            .hud {
                padding: 10px 15px;
                font-size: 13px;
            }
            #towerButtons {
                gap: 5px;
            }
            button {
                padding: 8px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div id="topLeft" class="hud">
                <div>Wave: <span id="waveCount">1</span></div>
                <div class="stat currency">Gold: <span id="currency">100</span></div>
                <div class="stat health">Health: <span id="health">100</span></div>
            </div>
            <div id="topRight" class="hud">
                <div class="stat prestige">Prestige: <span id="prestige">0</span></div>
                <div style="font-size: 12px; margin-top: 5px; color: #888;">Enemies: <span id="enemyCount">0</span>/<span id="enemyTotal">5</span></div>
            </div>
            <div id="bottom" class="hud">
                <div id="towerButtons"></div>
                <div style="margin-top: 10px; font-size: 12px; color: #888;">
                    Click to place | Drag to merge
                </div>
            </div>
            <div id="touchHint"></div>
            <div id="gameOver">
                <h1>RUN ENDED</h1>
                <p>Wave: <span id="finalWave">1</span></p>
                <p>Gold Earned: <span id="finalGold">0</span></p>
                <p>Prestige Gained: <span id="prestigeGained">0</span></p>
                <p class="stat prestige">Total Prestige: <span id="finalPrestige">0</span></p>
                <button onclick="location.reload()">Next Run</button>
            </div>
        </div>
    </div>

    <script>
        // Game state
        const game = {
            wave: 1,
            currency: 100,
            health: 100,
            maxHealth: 100,
            prestige: localStorage.getItem('prestige') ? parseInt(localStorage.getItem('prestige')) : 0,
            selectedTower: null,
            gameActive: true,
            difficulty: 1,
            unlockedTowers: [0, 1],
        };

        const towers = [
            { level: 1, cost: 20, damage: 5, range: 100, fireRate: 1.5, color: 0x4a9eff, unlocked: true },
            { level: 2, cost: 50, damage: 12, range: 120, fireRate: 1.8, color: 0x667eea, unlocked: true },
            { level: 3, cost: 150, damage: 30, range: 150, fireRate: 2, color: 0xa366ff, unlocked: false },
        ];

        const towerInstances = [];
        const enemies = [];
        const projectiles = [];
        const particles = [];
        const waves = [];
        let currentWaveIndex = 0;
        let waveActive = false;
        let nextEnemySpawn = 0;

        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e27);
        scene.fog = new THREE.Fog(0x0a0e27, 800, 200);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 100, 150);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        document.getElementById('gameContainer').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 200, 100);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.left = -300;
        directionalLight.shadow.camera.right = 300;
        directionalLight.shadow.camera.top = 300;
        directionalLight.shadow.camera.bottom = -300;
        scene.add(directionalLight);

        // Ground
        const groundGeom = new THREE.PlaneGeometry(400, 400);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1f3a });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid background
        const gridHelper = new THREE.GridHelper(400, 40, 0x2a3f5f, 0x1a2f4f);
        gridHelper.position.y = 0.1;
        scene.add(gridHelper);

        // Enemy path
        const pathPoints = [
            new THREE.Vector3(-150, 0, -150),
            new THREE.Vector3(-150, 0, 150),
            new THREE.Vector3(150, 0, 150),
            new THREE.Vector3(150, 0, -150),
        ];

        const pathGeometry = new THREE.BufferGeometry();
        pathGeometry.setFromPoints(pathPoints);
        const pathMaterial = new THREE.LineBasicMaterial({ color: 0x4a9eff, linewidth: 3 });
        const pathLine = new THREE.Line(pathGeometry, pathMaterial);
        pathLine.position.y = 0.2;
        scene.add(pathLine);

        // Create a curve for smoother enemy movement
        const curve = new THREE.CatmullRomCurve3(pathPoints, true);

        function createTowerMesh(towerData, position) {
            const group = new THREE.Group();

            const baseGeom = new THREE.CylinderGeometry(25, 30, 10, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x1a3a52, metalness: 0.3, roughness: 0.7 });
            const base = new THREE.Mesh(baseGeom, baseMat);
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);

            const towerGeom = new THREE.ConeGeometry(20, 50, 16);
            const towerMat = new THREE.MeshStandardMaterial({ color: towerData.color, metalness: 0.4, roughness: 0.6, emissive: towerData.color, emissiveIntensity: 0.2 });
            const tower = new THREE.Mesh(towerGeom, towerMat);
            tower.position.y = 30;
            tower.castShadow = true;
            tower.receiveShadow = true;
            group.add(tower);

            const orbGeom = new THREE.IcosahedronGeometry(5, 2);
            const orbMat = new THREE.MeshStandardMaterial({ color: towerData.color, emissive: towerData.color, emissiveIntensity: 0.8, metalness: 1 });
            const orb = new THREE.Mesh(orbGeom, orbMat);
            orb.position.y = 60;
            orb.castShadow = true;
            group.add(orb);

            group.position.copy(position);
            return group;
        }

        function createEnemyMesh(level) {
            const group = new THREE.Group();
            const size = 8 + level * 2;

            const bodyGeom = new THREE.BoxGeometry(size, size, size);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff6b6b, metalness: 0.2 });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            for (let i = 0; i < 3; i++) {
                const eyeGeom = new THREE.SphereGeometry(2, 8, 8);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.5 });
                const eye = new THREE.Mesh(eyeGeom, eyeMat);
                eye.position.set((i - 1) * 8, 2, size/2 + 1);
                group.add(eye);
            }

            return group;
        }

        function createProjectileMesh() {
            const geom = new THREE.SphereGeometry(3, 8, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.8 });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.castShadow = true;
            return mesh;
        }

        class Tower {
            constructor(level, position) {
                this.level = level;
                this.position = position.clone();
                this.data = towers[level];
                this.mesh = createTowerMesh(this.data, position);
                this.lastShot = 0;
                this.target = null;
                this.orb = this.mesh.children[2];
                this.orbRotation = 0;
                scene.add(this.mesh);
            }

            update(deltaTime) {
                this.lastShot += deltaTime;
                this.orbRotation += deltaTime * 2;
                this.orb.rotation.x = this.orbRotation;
                this.orb.rotation.z = this.orbRotation * 0.7;

                this.target = null;
                for (let enemy of enemies) {
                    const dist = this.position.distanceTo(enemy.position);
                    if (dist < this.data.range) {
                        this.target = enemy;
                        break;
                    }
                }

                if (this.target && this.lastShot >= 1 / this.data.fireRate) {
                    this.shoot();
                    this.lastShot = 0;
                }
            }

            shoot() {
                const projectile = new Projectile(this.position.clone(), this.target.position.clone(), this.data.damage);
                projectiles.push(projectile);
            }

            destroy() {
                scene.remove(this.mesh);
            }
        }

        class Enemy {
            constructor(level = 0) {
                this.level = level;
                this.health = 20 + level * 15;
                this.maxHealth = this.health;
                this.speed = 40 + level * 5;
                this.position = new THREE.Vector3(pathPoints[0].x, 0, pathPoints[0].z);
                this.mesh = createEnemyMesh(level);
                this.mesh.position.copy(this.position);
                this.pathProgress = 0;
                this.radius = 8 + level * 2;
                scene.add(this.mesh);
            }

            update(deltaTime) {
                this.pathProgress += (this.speed * deltaTime) / 1000;
                const point = curve.getPointAt(Math.min(this.pathProgress / 1000, 1));
                this.position.copy(point);
                this.mesh.position.copy(this.position);
                this.mesh.position.y = this.radius;

                const healthPercent = this.health / this.maxHealth;
                this.mesh.children[0].material.color.setHSL(0, 1, 0.4 + healthPercent * 0.2);
            }

            takeDamage(damage) {
                this.health -= damage;
                createParticleEffect(this.position.clone(), 0xff6b6b, 5);
            }

            isDead() {
                return this.health <= 0;
            }

            reachedEnd() {
                return this.pathProgress >= 1000;
            }

            destroy() {
                scene.remove(this.mesh);
            }
        }

        class Projectile {
            constructor(from, to, damage) {
                this.position = from.clone();
                this.target = to.clone();
                this.damage = damage;
                this.speed = 200;
                this.mesh = createProjectileMesh();
                this.mesh.position.copy(this.position);
                this.mesh.position.y = 20;
                scene.add(this.mesh);
                this.traveled = 0;
                this.distance = from.distanceTo(to);
            }

            update(deltaTime) {
                const moveDistance = this.speed * deltaTime;
                this.traveled += moveDistance;

                if (this.traveled >= this.distance) {
                    return true; // Done
                }

                const direction = new THREE.Vector3().subVectors(this.target, this.position).normalize();
                this.position.addScaledVector(direction, moveDistance);
                this.mesh.position.copy(this.position);
                this.mesh.position.y = 20;
                return false;
            }

            destroy() {
                scene.remove(this.mesh);
                createParticleEffect(this.position.clone(), 0xffd700, 8);
            }
        }

        function createParticleEffect(position, color, count) {
            for (let i = 0; i < count; i++) {
                const geom = new THREE.SphereGeometry(1, 4, 4);
                const mat = new THREE.MeshBasicMaterial({ color });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.copy(position);
                scene.add(mesh);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 100,
                    Math.random() * 100 + 50,
                    (Math.random() - 0.5) * 100
                );

                particles.push({
                    mesh, position: mesh.position, velocity, life: 0.5, maxLife: 0.5
                });
            }
        }

        function generateWaves() {
            waves.length = 0;
            for (let w = 0; w < 20; w++) {
                const count = 5 + Math.floor(w * 1.5);
                const level = Math.floor(w / 3);
                waves.push({ count, level, spawned: 0, spawning: false });
            }
        }

        function startWave() {
            if (currentWaveIndex >= waves.length) {
                generateWaves();
            }
            waveActive = true;
            nextEnemySpawn = 0;
            waves[currentWaveIndex].spawning = true;
        }

        function updateWave(deltaTime) {
            if (!waveActive) return;

            const wave = waves[currentWaveIndex];
            nextEnemySpawn -= deltaTime;

            if (nextEnemySpawn <= 0 && wave.spawned < wave.count) {
                enemies.push(new Enemy(wave.level));
                wave.spawned++;
                nextEnemySpawn = 0.3;
            }

            if (wave.spawned >= wave.count && enemies.length === 0) {
                waveActive = false;
                currentWaveIndex++;
                game.wave++;
                game.currency += 50 + currentWaveIndex * 10;
                game.difficulty = 1 + currentWaveIndex * 0.1;

                // Unlock higher towers
                if (game.wave === 5 && !towers[2].unlocked) {
                    towers[2].unlocked = true;
                    game.unlockedTowers.push(2);
                }

                updateUI();
                setTimeout(() => startWave(), 2000);
            }
        }

        function updateUI() {
            document.getElementById('waveCount').textContent = game.wave;
            document.getElementById('currency').textContent = game.currency;
            document.getElementById('health').textContent = Math.max(0, game.health);
            document.getElementById('prestige').textContent = game.prestige;
            document.getElementById('enemyCount').textContent = enemies.length;
            document.getElementById('enemyTotal').textContent = waves[currentWaveIndex]?.count || 0;

            const buttons = document.querySelectorAll('#towerButtons button');
            buttons.forEach((btn, i) => {
                btn.classList.toggle('disabled', game.currency < towers[i].cost);
            });
        }

        function createTowerButtons() {
            const container = document.getElementById('towerButtons');
            towers.forEach((tower, i) => {
                if (!tower.unlocked) return;
                const btn = document.createElement('button');
                btn.textContent = `Lv${tower.level} (${tower.cost}💰)`;
                btn.onclick = () => selectTower(i);
                container.appendChild(btn);
            });
        }

        function selectTower(level) {
            if (game.currency < towers[level].cost) return;
            game.selectedTower = level;
            document.body.style.cursor = 'crosshair';
        }

        let draggedTower = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function getGroundPosition(mouseX, mouseY) {
            raycaster.setFromCamera({ x: mouseX, y: mouseY }, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const target = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, target);
            target.x = Math.max(-180, Math.min(180, target.x));
            target.z = Math.max(-180, Math.min(180, target.z));
            return target;
        }

        function onMouseDown(event) {
            if (!game.gameActive) return;

            raycaster.setFromCamera(mouse, camera);
            const towerMeshes = towerInstances.map(t => t.mesh);
            const intersects = raycaster.intersectObjects(towerMeshes, true);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object.parent;
                draggedTower = towerInstances.find(t => t.mesh === clickedMesh);
            } else if (game.selectedTower !== null) {
                const pos = getGroundPosition(mouse.x, mouse.y);
                const tower = new Tower(game.selectedTower, pos);
                towerInstances.push(tower);
                game.currency -= towers[game.selectedTower].cost;
                game.selectedTower = null;
                document.body.style.cursor = 'auto';
                updateUI();
                createParticleEffect(pos, towers[game.selectedTower || 0].color, 10);
            }
        }

        function onMouseUp(event) {
            if (draggedTower) {
                const pos = getGroundPosition(mouse.x, mouse.y);
                let merged = false;

                for (let other of towerInstances) {
                    if (other === draggedTower) continue;
                    if (other.level === draggedTower.level && pos.distanceTo(other.position) < 40) {
                        // Merge!
                        if (draggedTower.level < towers.length - 1) {
                            const newTower = new Tower(draggedTower.level + 1, other.position);
                            towerInstances.push(newTower);

                            draggedTower.destroy();
                            other.destroy();
                            towerInstances.splice(towerInstances.indexOf(draggedTower), 1);
                            towerInstances.splice(towerInstances.indexOf(other), 1);

                            game.currency += Math.floor(towers[draggedTower.level].cost * 0.25);
                            createParticleEffect(other.position, newTower.data.color, 20);
                            merged = true;
                            break;
                        }
                    }
                }

                draggedTower = null;
                updateUI();
            }
        }

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mousedown', onMouseDown);
        document.addEventListener('mouseup', onMouseUp);

        // Touch support
        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            onMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
        });

        document.addEventListener('touchend', onMouseUp);

        function endGame() {
            game.gameActive = false;
            const prestigeGained = Math.floor(game.currency / 100) + (game.wave - 1) * 5;
            game.prestige += prestigeGained;
            localStorage.setItem('prestige', game.prestige);

            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalWave').textContent = game.wave;
            document.getElementById('finalGold').textContent = game.currency;
            document.getElementById('prestigeGained').textContent = prestigeGained;
            document.getElementById('finalPrestige').textContent = game.prestige;
        }

        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = 1 / 60;

            // Update towers
            for (let tower of towerInstances) {
                tower.update(deltaTime);
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.update(deltaTime);

                if (enemy.isDead()) {
                    enemy.destroy();
                    game.currency += 10 + enemy.level * 5;
                    enemies.splice(i, 1);
                    updateUI();
                } else if (enemy.reachedEnd()) {
                    enemy.destroy();
                    game.health -= 20 + enemy.level * 10;
                    enemies.splice(i, 1);
                    updateUI();

                    if (game.health <= 0) {
                        endGame();
                    }
                }
            }

            // Update projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                const isDone = proj.update(deltaTime);

                if (isDone) {
                    const hitEnemy = enemies.find(e => e.position.distanceTo(proj.position) < e.radius + 5);
                    if (hitEnemy) {
                        hitEnemy.takeDamage(proj.damage);
                    }
                    proj.destroy();
                    projectiles.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= deltaTime;
                p.position.addScaledVector(p.velocity, deltaTime);
                p.mesh.material.opacity = p.life / p.maxLife;

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            updateWave(deltaTime);
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        generateWaves();
        createTowerButtons();
        updateUI();
        startWave();
        animate();

        // Add prestige boost helper (for testing)
        window.addPrestige = (amount) => {
            game.prestige += amount;
            localStorage.setItem('prestige', game.prestige);
            updateUI();
        };
    </script>
</body>
</html>
